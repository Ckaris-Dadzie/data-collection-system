  <h1>📝 Action Plan Form</h1>

  <form id="actionPlanForm">
    <!-- ============================== -->
    <!-- 📍 Section 1: Metadata Fields -->
    <!-- ============================== -->
    <h2>Section 1: Facility Metadata</h2>

   <label>Sub-Municipal:
    <select id="sub_municipal" name="sub_municipal" required>
      <option value="">-- Select Sub-Municipal --</option>
      <option value="Kotobabi">Kotobabi</option>
      <option value="Accra New Town">Accra New Town</option>
      <option value="Alajo">Alajo</option>
      <option value="Kokomlemle">Kokomlemle</option>
    </select>
  </label><br><br>

  <label>Facility Name:
    <select id="facility_name" name="facility_name" required>
      <option value="">-- Select Facility --</option>
    </select>
  </label><br><br>
    <label>Monitoring Number:
      <input type="text" id="monitoring_number" name="monitoring_number" placeholder="e.g. 2025-001" required />

    <label>Quarter:
      <select id="quarter" name="quarter" required>
        <option value="">-- Select Quarter --</option>
        <option value="First Quarter">First Quarter</option>
        <option value="Second Quarter">Second Quarter</option>
        <option value="Third Quarter">Third Quarter</option>
        <option value="Fourth Quarter">Fourth Quarter</option>
      </select>
    </label><br><br>

    <label>Monitoring Year:
      <input type="number" id="monitoring_year" name="monitoring_year" required min="2000" max="2100" />
    </label><br><br>

    <label>Date:
      <input type="date" id="date" name="date" required />
    </label><br><br>

    <label>Name of Supervisor:
      <input type="text" id="supervisor_name" name="supervisor_name" required />
    </label><br><br>

    <label>Name of Facility In-Charge:
      <input type="text" id="in_charge_name" name="in_charge_name" required />
    </label>

    <!-- ============================== -->
    <!-- 📌 Section 2: Action Table -->
    <!-- ============================== -->
    <h2>Section 2: Action Plan Table</h2>

    <button type="button" class="btn btn-add" onclick="addActionRow()">➕ Add Row</button>

    <table id="actionsTable">
      <thead>
        <tr>
          <th>No.</th>
          <th>Clinical/Technical Area</th>
          <th>Challenges & Gaps</th>
          <th>Proposed Changes/Actions</th>
          <th>Indicator</th>
          <th>Time Frame</th>
          <th>Person Responsible</th>
          <th>Resources Required</th>
          <th>Next Assessment Date</th>
          <th>❌</th>
        </tr>
      </thead>
      <tbody>
        <!-- First row by default -->
        <tr>
          <td class="row-number">1</td>
          <td><input type="text" /></td>
          <td><textarea></textarea></td>
          <td><textarea></textarea></td>
          <td><input type="text" /></td>
          <td><input type="text" /></td>
          <td><input type="text" /></td>
          <td><input type="text" /></td>
          <td><input type="date" /></td>
          <td><button type="button" class="btn btn-remove" onclick="removeActionRow(this)">🗑️</button></td>
        </tr>
      </tbody>
    </table>

    <!-- ============================== -->
    <!-- 🚀 Submit Button -->
    <!-- ============================== -->
    <br><br>
    <button type="submit" class="submit-btn">✅ Submit Action Plan</button>
  </form>

  <!-- ============================== -->
  <!-- 📦 External JavaScript -->
  <!-- ============================== -->
   <script src="js/actionPlanForms.js"></script>
  <script src="nav.js"></script>
</body>
</html>
