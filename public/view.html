<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Submitted Forms</title>

  <!--Custom css links-->
  <link rel="stylesheet" href="view.css" />
  <link rel="stylesheet" href="nav.css" />

</head>
<body>

<!-- 🔗 Responsive Navigation Bar -->
<nav class="navbar">
  <div class="nav-container">
    <div class="nav-logo">📋 ACMHD IMSS</div>

    <!-- Hamburger icon (visible only on small screens) -->
    <button class="menu-toggle" id="menuToggle">☰</button>

    <!-- Navigation Links -->
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">📝 Submit Form</a></li>
      <li><a href="view.html">🔍 View Forms</a></li>
      <li><a href="edit.html">✏️ Edit Form</a></li>
      <li><a href="admin.html">🛠️ Admin</a></li>
      <li><a href="actionPlan.html">📋 Action Plan</a></li>
      <li><a href="viewActionPlans.html">📋 View Action Plans</a></li>
      <li><a href="#">🧪 Assessments</a></li>
    </ul>
  </div>
</nav>


  <div class="view-container">
    <h1>View Submitted Forms</h1>

    <!-- 🔍 Search Filters -->
    <div class="search-section">
      <label for="formTypeFilter">Form Type (Quarter):
        <select id="formTypeFilter">
          <option value="">-- Select --</option>
          <option>First Quarter</option>
          <option>Second Quarter</option>
          <option>Third Quarter</option>
          <option>Fourth Quarter</option>
        </select>
      </label>

      <label for="monitoringNumberFilter">Monitoring Number (Year):
        <input type="text" id="monitoringNumberFilter" placeholder="e.g., MN-2025-01" />
      </label>

      <label for="programFilter">Program:
        <select id="programFilter">
          <option value="">-- Select Program --</option>
          <option>Clinical Care</option>
          <option>Nutrition Services</option>
          <option>Expanded Program of Immunisation, Surveillance and Tuberculosis</option>
          <option>Health Promotion</option>
          <option>Financial Management</option>
          <option>Reproductive and Child Health</option>
          <option>Management of Stores and Supplies</option>
          <option>Quality Assurance</option>
          <option>Standards, Protocols and Guidelines</option>
          <option>Management Practice</option>
          <option>Malaria Elimination</option>
          <option>HIV/AIDS Control</option>
          <option>Health Information Management</option>
          <option>Mental Health</option>
          <option>CHPS/MCHNP</option>
        </select>
      </label>

      <label for="subMunicipalFilter">Sub-Municipal:
        <select id="subMunicipalFilter">
          <option value="">-- Select Sub-Municipal --</option>
          <option value="Kotobabi">Kotobabi</option>
          <option value="Accra New Town">Accra New Town</option>
          <option value="Alajo">Alajo</option>
          <option value="Kokomlemle">Kokomlemle</option>
        </select>
      </label>

      <label for="facilityVisitedFilter">Facility Visited:
        <select id="facilityVisitedFilter">
          <option value="">-- Select Facility --</option>
        </select>
      </label>

      <button id="searchBtn">Search</button>
      <button onclick="window.print()">Print</button>
    </div>

    <!-- 📋 Results Section -->
    <div id="formResults" class="results-section">
      <!-- Metadata Table -->
      <div id="metadataSection" class="metadata-section"></div>

      <!-- Introduction Questions Table -->
      <div id="questionsSection" class="questions-section"></div>

      <!-- General Comments -->
      <div id="commentsSection" class="comments-section"></div>
    </div>
  </div>

  <script src="view.js"></script>
  <script src="nav.js"></script>
</body>
</html>
