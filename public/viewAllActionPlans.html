<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>View All Action Plans</title>
    <!-- 📄 Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- 📄 Custom CSS -->
    <link rel="stylesheet" href="nav.css"> 
  <link rel="stylesheet" href="css/viewAllActionPlans.css">
</head>


<body>

    <!-- 🔗 Responsive Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">📋 ACMHD IMSS</div>
      <button class="menu-toggle" id="menuToggle">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">📝 Submit Form</a></li>
        <li><a href="view.html">🔍 View Forms</a></li>
        <li><a href="edit.html">✏️ Edit Form</a></li>
        <li><a href="admin.html">🛠️ Admin</a></li>
        <li><a href="actionPlan.html">📋 Action Plan</a></li>
        <li><a href="viewActionPlans.html">📋 View Action Plans</a></li>
        <li><a href="editActionPlan.html">✏️ Edit Action Plan</a></li>
        <li><a href="viewAllActionPlans.html">📋 All Action Plans</a></li>
        <li><a href="#">🧪 Assessments</a></li>
      </ul>
    </div>
  </nav>


  <div class="container">
    <h1>📋 All Action Plans</h1>

        <div class="search-filters">
        <!-- 🌍 Sub-Municipal -->
        <label for="sub_municipal">Sub-Municipal</label>
        <select id="sub_municipal" name="sub_municipal">
            <option value="">Select Sub-Municipal</option>
            <option value="Kotobabi">Kotobabi</option>
            <option value="Accra New Town">Accra New Town</option>
            <option value="Alajo">Alajo</option>
            <option value="Kokomlemle">Kokomlemle</option>
        </select>

        <!-- 🏥 Facility -->
        <label for="facility_name">Facility</label>
        <select id="facility_name" name="facility_name">
            <option value="">Select Facility</option>
        </select>

        <!-- 📆 Quarter -->
        <label for="quarter">Quarter</label>
        <select id="quarter" name="quarter">
            <option value="">Select Quarter</option>
            <option value="First Quarter">First Quarter</option>
            <option value="Second Quarter">Second Quarter</option>
            <option value="Third Quarter">Third Quarter</option>
            <option value="Fourth Quarter">Fourth Quarter</option>
        </select>

        <!-- 📅 Year -->
        <label for="monitoring_year">Year</label>
        <input type="number" id="monitoring_year" name="monitoring_year" placeholder="e.g. 2025" />

        <!-- 🔍 Search Button -->
        <button id="searchBtn">Search</button>
        </div>


    <!-- 📑 Action Plans Table -->
    <table id="actionPlansTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Sub-Municipal</th>
          <th>Facility</th>
          <th>Quarter</th>
          <th>Year</th>
          <th>Date</th>
          <th>Supervisor</th>
          <th>In-Charge</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Populated dynamically via JS -->
      </tbody>
    </table>

    <!-- 🔄 Pagination Controls -->
    <div id="pagination">
      <button id="prevPage">⏮️ Prev</button>
      <span id="currentPage">Page 1</span>
      <button id="nextPage">⏭️ Next</button>
    </div>
  </div>

  <!-- 🔍 Modal for Viewing Action Plan -->
<div id="previewModal" style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%); width:80%; background:white; padding:20px; border:1px solid #ccc; box-shadow:0 0 10px rgba(0,0,0,0.3); z-index:1000;">
  <span id="modalClose" style="float:right; cursor:pointer; font-size:18px;">❌</span>
  <div id="modalContent"></div>
</div>

  <!-- 💻 JS Script -->
  <script src="js/viewAllActionPlansPage.js"></script>
</body>
</html>
